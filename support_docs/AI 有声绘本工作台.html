<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 有声绘本工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  /* Light Morandi palette — muted, dusty, low-saturation */
  --bg:        #ece6da;   /* warm stone */
  --bg-2:      #ddd6c6;   /* deeper stone */
  --paper:     #f6f1e6;   /* off-white linen */
  --paper-2:   #f1ebde;
  --line:      #c8bfae;
  --line-2:    #b3a895;
  --text:      #3d3a32;   /* dark olive-stone */
  --text-2:    #7d7666;
  --text-3:    #a89e8c;

  --coral:     #b8907e;   /* dusty terracotta */
  --coral-2:   #a37e6c;
  --mint:      #93a88f;   /* sage */
  --sky:       #9caeb8;   /* dusty blue */
  --sun:       #c5ad7e;   /* muted ochre */
  --grape:     #a896a8;   /* mauve */
  --grape-2:   #877787;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  --shadow-sm: 0 2px 6px rgba(122, 89, 64, 0.08);
  --shadow-md: 0 6px 18px rgba(122, 89, 64, 0.12);
  --shadow-lg: 0 14px 32px rgba(122, 89, 64, 0.18);

  --sans: 'Nunito', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; width: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: 68px 1fr;
  height: 100vh;
  width: 100vw;
  background: var(--bg);
}

/* ---------- TOPBAR ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
  background: linear-gradient(180deg, #f4eee2 0%, #ece6da 100%);
  border-bottom: 1.5px solid var(--line);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #b8907e 0%, #c5ad7e 100%);
  display: grid; place-items: center;
  box-shadow: 0 4px 12px rgba(184,144,126,0.30), inset 0 0 0 1px rgba(255,255,255,0.4);
  color: white;
}
.brand-text { line-height: 1.15; }
.brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.01em; }
.brand-sub { font-size: 11.5px; color: var(--text-2); font-weight: 600; letter-spacing: 0.04em; }

.topbar-divider { width: 1px; height: 28px; background: var(--line); }

.project-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 14px; height: 38px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  min-width: 220px;
}
.project-pill input {
  background: transparent; border: none; outline: none;
  font-size: 13px; flex: 1;
  color: var(--text); font-weight: 600;
}
.project-pill .saved {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--mint);
  padding: 3px 7px;
  background: rgba(147,168,143,0.16);
  border-radius: 6px;
}

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--text);
  transition: all 0.14s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-2); border-color: var(--line-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary {
  background: var(--coral);
  color: white;
  border-color: var(--coral);
  box-shadow: 0 4px 12px rgba(184,144,126,0.30);
}
.btn.primary:hover { background: var(--coral-2); border-color: var(--coral-2); box-shadow: 0 6px 16px rgba(163,126,108,0.38); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-2); }
.btn.sq { width: 38px; padding: 0; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn.lg { height: 46px; padding: 0 22px; font-size: 14px; }

.avatars { display: flex; align-items: center; margin-left: 6px; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2.5px solid #fefaf0;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
  color: white;
  margin-left: -8px;
}
.avatar:first-child { margin-left: 0; }
.avatar.me   { background: linear-gradient(135deg, #b8907e, #a37e6c); }
.avatar.peer { background: linear-gradient(135deg, #9caeb8, #7d909e); }
.avatar.ai   { background: linear-gradient(135deg, #a896a8, #877787); position: relative; }
.avatar.ai::after {
  content: ''; position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--mint); border: 2px solid #fefaf0;
}

/* ============================================================
   MAIN: three-column grid
   ============================================================ */
.main {
  display: grid;
  grid-template-columns: 280px 1fr 290px;
  min-height: 0;
  overflow: hidden;
}

/* ---------- LEFT SIDEBAR ---------- */
.sidebar-left {
  display: flex; flex-direction: column;
  border-right: 1.5px solid var(--line);
  background: linear-gradient(180deg, #ece6da 0%, #ddd6c6 100%);
  min-height: 0;
}
.sidebar-left .section {
  padding: 14px 16px;
  border-bottom: 1.5px solid var(--line);
}
.sidebar-left .section.shelf-section { padding-bottom: 14px; }
.sidebar-left .section.flex-grow { flex: 1; overflow-y: auto; border-bottom: none; }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}
.section-meta { font-size: 11.5px; color: var(--text-2); font-weight: 600; }

/* ---- Story shelf ---- */
.shelf-scroll {
  display: flex; gap: 12px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  margin: 0 -2px;
  scroll-snap-type: x mandatory;
}
.shelf-scroll::-webkit-scrollbar { height: 6px; }
.shelf-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

.book-card {
  flex: 0 0 158px;
  height: 200px;
  border-radius: 14px;
  padding: 14px;
  color: white;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: start;
  display: flex; flex-direction: column;
  box-shadow: 0 6px 16px rgba(0,0,0,0.16), inset 0 0 0 1px rgba(255,255,255,0.18);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.book-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,0.22); }
.book-card::before {
  content: ''; position: absolute;
  inset: 0;
  background: radial-gradient(circle at 15% 18%, rgba(255,255,255,0.22), transparent 55%);
  pointer-events: none;
}
.book-card.active { outline: 3px solid var(--text); outline-offset: 3px; }
.book-spine {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 6px;
  background: rgba(0,0,0,0.18);
}
.book-glyph {
  font-size: 38px;
  margin: 6px 0 10px 4px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.book-title { font-size: 14.5px; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.book-sub { font-size: 11px; opacity: 0.88; font-weight: 600; margin-top: 3px; line-height: 1.25; }
.book-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.book-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.28);
  color: white;
  font-weight: 700;
}

/* ---- Voice guide ---- */
.voice-card {
  background: linear-gradient(135deg, #e5dde4 0%, #dde3e6 100%);
  border: 1.5px solid rgba(168,150,168,0.32);
  border-radius: 16px;
  padding: 14px;
}
.voice-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.ai-avatar {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #a896a8, #877787);
  display: grid; place-items: center;
  color: white;
  box-shadow: 0 4px 10px rgba(168,150,168,0.32);
  flex-shrink: 0;
  position: relative;
}
.ai-avatar.playing::after {
  content: ''; position: absolute; inset: -3px;
  border-radius: 15px;
  border: 2px solid var(--grape);
  animation: pulse-ring 1.4s ease-out infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.5); opacity: 0; }
}
.voice-meta { line-height: 1.2; flex: 1; min-width: 0; }
.voice-title { font-size: 13px; font-weight: 800; color: var(--grape-2); }
.voice-step { font-size: 11px; color: var(--text-2); font-weight: 600; margin-top: 2px; }

.voice-quote {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.55;
  padding: 10px 12px;
  background: white;
  border-radius: 10px;
  margin-bottom: 12px;
  position: relative;
  border: 1px solid rgba(168,150,168,0.20);
}
.voice-quote::before {
  content: '“';
  position: absolute; top: -8px; left: 8px;
  font-size: 28px;
  color: var(--grape);
  font-family: Georgia, serif;
  line-height: 1;
}

.waveform {
  display: flex; align-items: center; gap: 3px;
  height: 22px;
  margin-bottom: 12px;
  padding: 0 4px;
}
.waveform .bar {
  flex: 1;
  background: linear-gradient(180deg, var(--grape), var(--grape-2));
  border-radius: 999px;
  min-height: 4px;
  transition: height 0.16s ease;
}
.waveform.playing .bar { animation: wave 0.8s ease-in-out infinite; }
.waveform.playing .bar:nth-child(2) { animation-delay: 0.08s; }
.waveform.playing .bar:nth-child(3) { animation-delay: 0.16s; }
.waveform.playing .bar:nth-child(4) { animation-delay: 0.24s; }
.waveform.playing .bar:nth-child(5) { animation-delay: 0.32s; }
.waveform.playing .bar:nth-child(6) { animation-delay: 0.40s; }
.waveform.playing .bar:nth-child(7) { animation-delay: 0.48s; }
.waveform.playing .bar:nth-child(8) { animation-delay: 0.56s; }
.waveform.playing .bar:nth-child(9) { animation-delay: 0.64s; }
.waveform.playing .bar:nth-child(10) { animation-delay: 0.72s; }
.waveform.playing .bar:nth-child(11) { animation-delay: 0.80s; }
.waveform.playing .bar:nth-child(12) { animation-delay: 0.88s; }
.waveform.playing .bar:nth-child(13) { animation-delay: 0.96s; }
.waveform.playing .bar:nth-child(14) { animation-delay: 1.04s; }
@keyframes wave {
  0%, 100% { height: 4px; }
  50% { height: 22px; }
}

.voice-controls { display: flex; align-items: center; gap: 6px; }
.voice-controls .btn { flex: 1; height: 36px; font-size: 12px; padding: 0 10px; }
.voice-controls .btn.primary { background: var(--grape); border-color: var(--grape); box-shadow: 0 3px 9px rgba(168,150,168,0.32); }
.voice-controls .btn.primary:hover { background: var(--grape-2); border-color: var(--grape-2); }

/* ---- Story text ---- */
.story-text-card {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.story-text-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.story-text-title { font-size: 13px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 6px; }
.story-toggle {
  font-size: 11px; font-weight: 700;
  color: var(--text-2);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-2);
  transition: all 0.14s ease;
}
.story-toggle:hover { background: var(--line); color: var(--text); }

.story-body {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text);
  font-weight: 500;
  max-height: 280px;
  overflow-y: auto;
  padding-right: 4px;
}
.story-body .sentence {
  display: inline;
  padding: 1px 4px;
  margin: 0 -2px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.14s ease;
}
.story-body .sentence:hover { background: var(--bg-2); }
.story-body .sentence.current {
  background: linear-gradient(180deg, #e6dcc6 0%, #d9caa6 100%);
  color: var(--text);
  font-weight: 700;
  box-shadow: 0 1px 0 var(--sun);
}
.story-body .sentence.recommended-bg {
  background: rgba(168,150,168,0.18);
  text-decoration: underline wavy rgba(168,150,168,0.50);
  text-underline-offset: 4px;
}

/* ============================================================
   CENTER STAGE
   ============================================================ */
.stage {
  display: grid;
  grid-template-rows: 64px 1fr 86px;
  min-height: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(197,173,126,0.14), transparent 60%),
    radial-gradient(circle at 90% 90%, rgba(147,168,143,0.16), transparent 50%),
    var(--bg);
  overflow: hidden;
}

/* ---- Stage top: AI hint button + bg picker ---- */
.stage-top {
  display: flex; align-items: center; gap: 12px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,250,240,0.6), transparent);
}
.ai-prompt-btn {
  display: inline-flex; align-items: center; gap: 10px;
  height: 44px;
  padding: 0 18px 0 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, #a896a8 0%, #877787 100%);
  color: white;
  font-weight: 800;
  font-size: 13.5px;
  box-shadow: 0 6px 16px rgba(168,150,168,0.32), inset 0 0 0 1px rgba(255,255,255,0.2);
  transition: all 0.16s ease;
}
.ai-prompt-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(168,150,168,0.40); }
.ai-prompt-btn:disabled { opacity: 0.6; cursor: wait; }
.ai-prompt-btn .sparkle-bubble {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: grid; place-items: center;
}
.ai-prompt-btn .sparkle-bubble.thinking svg { animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bg-picker { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.bg-picker-label { font-size: 11px; color: var(--text-2); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 4px; }
.bg-swatch {
  width: 32px; height: 32px;
  border-radius: 9px;
  border: 2px solid var(--line);
  cursor: pointer;
  transition: all 0.14s ease;
  position: relative;
}
.bg-swatch:hover { transform: scale(1.08); border-color: var(--coral); }
.bg-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.bg-swatch::after {
  content: attr(data-name);
  position: absolute;
  bottom: -22px; left: 50%; transform: translateX(-50%);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-2);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.14s ease;
  pointer-events: none;
}
.bg-swatch:hover::after, .bg-swatch.active::after { opacity: 1; }

/* ---- AI hint bubble (floating above canvas) ---- */
.hint-bubble {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 540px;
  background: linear-gradient(135deg, rgba(232,222,232,0.96), rgba(220,224,230,0.96));
  border: 1.5px solid var(--grape);
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: 0 10px 30px rgba(168,150,168,0.30);
  backdrop-filter: blur(8px);
  display: flex; gap: 12px;
  z-index: 5;
  animation: bubble-in 0.3s ease-out;
}
@keyframes bubble-in {
  from { opacity: 0; transform: translate(-50%, -10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
.hint-bubble::after {
  content: '';
  position: absolute;
  top: -8px; left: 24px;
  width: 14px; height: 14px;
  background: linear-gradient(135deg, rgba(232,222,232,0.96), rgba(220,224,230,0.96));
  border-left: 1.5px solid var(--grape);
  border-top: 1.5px solid var(--grape);
  transform: rotate(45deg);
}
.hint-bubble .hint-icon {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--grape);
  display: grid; place-items: center;
  color: white;
  flex-shrink: 0;
}
.hint-bubble .hint-body { flex: 1; min-width: 0; }
.hint-bubble .hint-kind {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--grape-2);
  margin-bottom: 2px;
}
.hint-bubble .hint-text { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.55; }
.hint-bubble .hint-close {
  position: absolute;
  top: 8px; right: 10px;
  width: 22px; height: 22px;
  border-radius: 50%;
  color: var(--text-2);
  display: grid; place-items: center;
  transition: all 0.14s ease;
}
.hint-bubble .hint-close:hover { background: rgba(0,0,0,0.06); color: var(--text); }

/* ---- Canvas wrapper ---- */
.canvas-wrap {
  position: relative;
  padding: 14px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.canvas {
  position: relative;
  width: 100%;
  max-width: 1280px;
  aspect-ratio: 16 / 10;
  background: var(--paper);
  border-radius: 20px;
  box-shadow:
    0 14px 38px rgba(122, 89, 64, 0.22),
    inset 0 0 0 1px rgba(255,255,255,0.5);
  overflow: hidden;
  cursor: default;
}
.canvas.drop-target { box-shadow: 0 0 0 3px var(--coral), 0 14px 38px rgba(184,144,126,0.34); }
.canvas-bg {
  position: absolute; inset: 0;
  transition: background 0.3s ease;
}
.canvas-paper-texture {
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,0.03), transparent 40%);
}
.canvas-empty-hint {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
}
.canvas-empty-hint .big {
  font-size: 36px; margin-bottom: 8px;
  opacity: 0.4;
}
.canvas-empty-hint .sub {
  font-size: 12px; color: var(--text-3); margin-top: 6px;
  font-weight: 600;
}

/* ---- Canvas object ---- */
.cobj {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: grab;
  user-select: none;
  touch-action: none;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.18));
  transition: filter 0.14s ease;
}
.cobj.dragging { cursor: grabbing; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); }
.cobj .cobj-glyph {
  font-size: 60px;
  line-height: 1;
  display: block;
  pointer-events: none;
}
.cobj.selected .cobj-glyph {
  outline: 2.5px dashed var(--coral);
  outline-offset: 10px;
  border-radius: 8px;
}
.cobj-handles {
  position: absolute;
  inset: -8px;
  pointer-events: none;
}
.cobj-handle {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--coral);
  pointer-events: auto;
  cursor: nwse-resize;
}
.cobj-handle.tl { top: -7px; left: -7px; cursor: nwse-resize; }
.cobj-handle.tr { top: -7px; right: -7px; cursor: nesw-resize; }
.cobj-handle.bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
.cobj-handle.br { bottom: -7px; right: -7px; cursor: nwse-resize; }

/* ---- Object floating toolbar ---- */
.cobj-toolbar {
  position: absolute;
  top: -52px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;

<script type="text/babel">
// canvas.jsx — drag/drop canvas + objects + AI hint bubble
const { useState, useRef, useEffect, useCallback } = React;

// Helper: find icon by id
const findIcon = (id) => window.DATA.ICON_LIB.find(i => i.id === id);

// Single canvas object — click to select, drag to move, +/- to zoom
const CanvasObject = ({ obj, selected, onSelect, onChange, onDelete, onCopy, canvasRef }) => {
  const icon = findIcon(obj.iconId);
  const dragState = useRef(null);
  const [dragging, setDragging] = useState(false);

  const onPointerDown = (e, mode) => {
    e.stopPropagation();
    const cvs = canvasRef.current;
    const rect = cvs.getBoundingClientRect();
    dragState.current = {
      mode,
      pending: mode === 'move',   // wait for drag threshold before moving
      wasSelected: selected,
      startX: e.clientX, startY: e.clientY,
      startObjX: obj.x, startObjY: obj.y,
      startScale: obj.scale,
      cvsW: rect.width, cvsH: rect.height,
    };
    // select on press (so toolbar/handles appear immediately)
    if (!selected) onSelect(obj.id);
    e.target.setPointerCapture?.(e.pointerId);
  };

  const onPointerMove = (e) => {
    const ds = dragState.current;
    if (!ds) return;
    if (ds.mode === 'move') {
      const rawDx = e.clientX - ds.startX;
      const rawDy = e.clientY - ds.startY;
      if (ds.pending) {
        if (Math.abs(rawDx) + Math.abs(rawDy) < 5) return;  // tap, not drag
        ds.pending = false;
        setDragging(true);
      }
      const dx = rawDx / ds.cvsW * 100;
      const dy = rawDy / ds.cvsH * 100;
      const nx = Math.max(2, Math.min(98, ds.startObjX + dx));
      const ny = Math.max(2, Math.min(98, ds.startObjY + dy));
      onChange(obj.id, { x: nx, y: ny });
    } else if (ds.mode === 'scale') {
      const dx = e.clientX - ds.startX;
      const dy = e.clientY - ds.startY;
      const delta = (dx + dy) / 100;
      const ns = Math.max(0.3, Math.min(2.5, ds.startScale + delta));
      onChange(obj.id, { scale: ns });
    }
  };

  const onPointerUp = (e) => {
    setDragging(false);
    dragState.current = null;
  };

  const zoomBy = (e, delta) => {
    e.stopPropagation();
    const ns = Math.max(0.3, Math.min(2.5, +(obj.scale + delta).toFixed(2)));
    onChange(obj.id, { scale: ns });
  };

  // spatial-audio derived labels
  const positionLabel = obj.x < 33 ? '左' : obj.x > 66 ? '右' : '中';
  const distanceLabel = obj.scale > 1.2 ? '近' : obj.scale < 0.7 ? '远' : '中';
  const volumeLabel = obj.scale > 1.2 ? '大' : obj.scale < 0.7 ? '小' : '中';

  return (
    <div
      className={`cobj ${selected ? 'selected' : ''} ${dragging ? 'dragging' : ''}`}
      style={{
        left: `${obj.x}%`,
        top: `${obj.y}%`,
        transform: `translate(-50%, -50%) scale(${obj.scale}) rotate(${obj.rotation || 0}deg)`,
        zIndex: obj.z || 1,
      }}
      onPointerDown={(e) => onPointerDown(e, 'move')}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      onClick={(e) => e.stopPropagation()}
      onDoubleClick={(e) => { e.stopPropagation(); zoomBy(e, 0.25); }}
    >
      <span className="cobj-glyph">{icon.glyph}</span>
      {selected && (
        <>
          <div className="cobj-handles">
            <div className="cobj-handle br" onPointerDown={(e) => onPointerDown(e, 'scale')} onPointerMove={onPointerMove} onPointerUp={onPointerUp}></div>
            <div className="cobj-handle tl"></div>
            <div className="cobj-handle tr"></div>
            <div className="cobj-handle bl"></div>
          </div>
          <div className="cobj-toolbar" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
            <button className="tbtn" title="放大" onClick={(e) => zoomBy(e, 0.2)} disabled={obj.scale >= 2.5}>
              <Icon name="plus" size={14} />
            </button>
            <span className="cobj-scale-pct">{Math.round(obj.scale * 100)}%</span>
            <button className="tbtn" title="缩小" onClick={(e) => zoomBy(e, -0.2)} disabled={obj.scale <= 0.3}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <div className="cobj-toolbar-divider"></div>
            <button className="tbtn" title="试听" onClick={(e) => { e.stopPropagation(); window.__playIconSound?.(icon); }}>
              <Icon name="volume" size={14} />
            </button>
            <button className="tbtn" title="复制" onClick={(e) => { e.stopPropagation(); onCopy(obj.id); }}>
              <Icon name="copy" size={13} />
            </button>
            <div className="cobj-toolbar-divider"></div>
            <button className="tbtn danger" title="删除" onClick={(e) => { e.stopPropagation(); onDelete(obj.id); }}>
              <Icon name="trash" size={13} />
            </button>
          </div>
          <div className="cobj-attr" onPointerDown={(e) => e.stopPropagation()}>
            <div className="cobj-attr-row"><span className="k">名称</span><span className="v">{icon.name}</span></div>
            <div className="cobj-attr-row"><span className="k">声音</span><span className="v">{icon.sound}</span></div>
            <div className="cobj-attr-row"><span className="k">位置</span><span className="v">{positionLabel} · 声音偏{positionLabel}</span></div>
            <div className="cobj-attr-row"><span className="k">距离</span><span className="v">{distanceLabel} · 音量{volumeLabel}</span></div>
          </div>
        </>
      )}
    </div>
  );
};

// Canvas + object layer
const Canvas = ({
  objects, selectedId, bgTemplate,
  onSelect, onUpdate, onAdd, onDelete, onCopy,
  hint, onHintClose,
  onUndo, onRedo, canUndo, canRedo, onClear,
}) => {
  const canvasRef = useRef(null);
  const [dropping, setDropping] = useState(false);
  const [showHelper, setShowHelper] = useState(false);

  const bg = window.DATA.BG_TEMPLATES.find(b => b.id === bgTemplate);

  const onDragOver = (e) => { e.preventDefault(); setDropping(true); };
  const onDragLeave = () => setDropping(false);
  const onDrop = (e) => {
    e.preventDefault();
    setDropping(false);
    const iconId = e.dataTransfer.getData('iconId');
    if (!iconId) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    onAdd(iconId, x, y);
  };

  const onCanvasClick = () => onSelect(null);

  return (
    <div className="canvas-wrap" onClick={onCanvasClick}>
      {hint && (
        <div className="hint-bubble" onClick={(e) => e.stopPropagation()}>
          <div className="hint-icon">

            <div className="hint-text">{hint.text}</div>
          </div>
          <button className="hint-close" onClick={onHintClose}>
            <Icon name="x" size={14} />
          </button>
        </div>
      )}

      <div className="canvas-tools" onClick={(e) => e.stopPropagation()}>
        <button className="ctool" title="撤销" onClick={onUndo} disabled={!canUndo}>
          <Icon name="undo" size={14} />
        </button>
        <button className="ctool" title="重做" onClick={onRedo} disabled={!canRedo}>
          <Icon name="redo" size={14} />
        </button>
        <button className="ctool danger" title="清空画布" onClick={onClear}>
          <Icon name="trash" size={14} />
        </button>
      </div>

      <div
        ref={canvasRef}
        className={`canvas ${dropping ? 'drop-target' : ''}`}
        onDragOver={onDragOver}
        onDragLeave={onDragLeave}
        onDrop={onDrop}
        onClick={(e) => { e.stopPropagation(); onSelect(null); }}
      >
        <div className="canvas-bg" style={{ background: bg.css }}></div>
        <div className="canvas-paper-texture"></div>

        {objects.length === 0 && (
          <div className="canvas-empty-hint">
            <div>
              <div className="big">✦</div>
              <div>从右侧拖入小图标，开始拼贴你的画面</div>
              <div className="sub">图片位置 → 声音方向 · 图片大小 → 声音远近</div>
            </div>
          </div>
        )}

        {objects.map((obj) => (
          <CanvasObject
            key={obj.id}
            obj={obj}
            selected={selectedId === obj.id}
            onSelect={onSelect}
            onChange={onUpdate}
            onDelete={onDelete}
            onCopy={onCopy}
            canvasRef={canvasRef}
          />
        ))}

        <button className="canvas-helper" onClick={(e) => { e.stopPropagation(); setShowHelper(s => !s); }}>
          <Icon name="info" size={12} />
          图片位置 = 声音方向
        </button>

        {showHelper && (
          <div className="canvas-helper-popup" onClick={(e) => e.stopPropagation()}>
            <h4>画面与声音的关系</h4>
            <div className="rule">
              <span className="arrow">←</span>
              <span>图标靠左 · 声音从左边传来</span>
            </div>
            <div className="rule">
              <span className="arrow">→</span>
              <span>图标靠右 · 声音从右边传来</span>
            </div>
            <div className="rule">
              <span className="arrow">⤢</span>
              <span>图标变大 · 声音更近 · 更响</span>

            <div className="rule">

              <span>图标变小 · 声音更远 · 更轻</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

window.Canvas = Canvas;

</script>

const StoryText = ({ story, stepIndex, recommendedIds, showFull, onToggleFull, onStepSelect }) => {
  // Split full text into sentences. We use the actual story.steps as known sentences for highlight matching;
  // any other sentences get plain text rendering.
  const stepTexts = story.steps.map(s => s.text);
  // Build a list of {text, stepIdx | null}
  let remain = story.fullText;
  const parts = [];
  while (remain.length) {
    // find earliest matching step text
    let nextIdx = -1, matchedStep = -1;
    stepTexts.forEach((t, i) => {
      const at = remain.indexOf(t);
      if (at !== -1 && (nextIdx === -1 || at < nextIdx)) {
        nextIdx = at;
        matchedStep = i;
      }
    });
    if (nextIdx === -1) { parts.push({ text: remain, step: null }); break; }
    if (nextIdx > 0) parts.push({ text: remain.slice(0, nextIdx), step: null });
    parts.push({ text: stepTexts[matchedStep], step: matchedStep });
    remain = remain.slice(nextIdx + stepTexts[matchedStep].length);
  }

  return (
    <div className="section flex-grow">
      <div className="story-text-card">
        <div className="story-text-head">
          <div className="story-text-title">
            <Icon name="book" size={13} /> 故事正文

          </button>
        </div>
        {showFull && (
          <div className="story-body">
            {parts.map((p, i) => (
              <span
                key={i}
                className={`sentence ${p.step === stepIndex ? 'current' : ''}`}
                onClick={() => p.step !== null && onStepSelect(p.step)}
              >
                {p.text}
              </span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

};

<script type="text/babel">
// app.jsx — root composition + state
const { useState: useS, useRef: useR, useEffect: useE, useMemo: useM, useCallback: useC, Fragment: Frag } = React;

/* ============================================================
   AUDIO — tiny synth helpers so the demo can actually beep.
   ============================================================ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let _ac = null;
const ac = () => { if (!_ac) _ac = new AudioCtx(); return _ac; };

const playTone = (freq, dur = 0.4, type = 'sine', vol = 0.18) => {
  try {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g).connect(c.destination);
    const now = c.currentTime;
    g.gain.linearRampToValueAtTime(vol, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now);
    o.stop(now + dur + 0.05);
  } catch {}
};

// quick "voice line" — a sequence of tones to simulate TTS
const playVoiceLine = (durSec, onEnd) => {
  const c = ac();
  const start = c.currentTime;
  const notes = [261, 329, 392, 440, 349, 293];
  const stepDur = durSec / notes.length;
  notes.forEach((f, i) => {
    setTimeout(() => playTone(f * 0.6, stepDur * 0.85, 'sine', 0.10), i * stepDur * 1000);
  });
  const t = setTimeout(() => onEnd?.(), durSec * 1000);
  return () => clearTimeout(t);
};

// Icon-specific cute sounds
const iconSoundMap = {
  bird: () => { [880, 1100, 990, 1320].forEach((f, i) => setTimeout(() => playTone(f, 0.18, 'triangle', 0.12), i * 90)); },
  cow:  () => { playTone(120, 0.6, 'sawtooth', 0.18); setTimeout(() => playTone(95, 0.5, 'sawtooth', 0.16), 300); },
  cat:  () => { [440, 660, 550].forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'sine', 0.12), i * 110)); },
  dog:  () => { [220, 280].forEach((f, i) => setTimeout(() => playTone(f, 0.18, 'square', 0.1), i * 130)); },
  rain: () => { for (let i = 0; i < 10; i++) setTimeout(() => playTone(2000 + Math.random() * 2000, 0.04, 'triangle', 0.05), i * 50); },
  wind: () => { playTone(180, 0.9, 'sine', 0.08); },
  bell: () => { [1320, 990].forEach((f, i) => setTimeout(() => playTone(f, 0.5, 'triangle', 0.14), i * 160)); },
  clock: () => { [600, 600].forEach((f, i) => setTimeout(() => playTone(f, 0.05, 'square', 0.08), i * 400)); },
  rabbit: () => { [660, 880, 660].forEach((f, i) => setTimeout(() => playTone(f, 0.1, 'triangle', 0.1), i * 80)); },
  fish: () => { playTone(500, 0.1, 'sine', 0.08); setTimeout(() => playTone(700, 0.05, 'sine', 0.06), 100); },
  frog: () => { playTone(180, 0.3, 'square', 0.14); },
  sheep: () => { for (let i = 0; i < 4; i++) setTimeout(() => playTone(380 + Math.random() * 30, 0.12, 'sawtooth', 0.1), i * 80); },
  default: () => { playTone(523, 0.18, 'sine', 0.12); setTimeout(() => playTone(659, 0.2, 'sine', 0.12), 120); },
};

const playIconSound = (icon) => (iconSoundMap[icon.id] || iconSoundMap.default)();
window.__playIconSound = playIconSound;

/* ============================================================
   STATE HELPERS
   ============================================================ */
let _objCounter = 1;
const newObjectId = () => `obj_${String(_objCounter++).padStart(3, '0')}`;

const GEN_STAGES = [
  { id: 'analyze', label: '正在分析画面…',   pct: 25 },
  { id: 'arrange', label: '正在安排声音…',   pct: 50 },
  { id: 'voice',   label: '正在生成语音…',   pct: 75 },
  { id: 'mix',     label: '正在合成有声绘本…', pct: 100 },
];

/* ============================================================
   TOP BAR
   ============================================================ */

      </div>
    </div>

    <div className="topbar-divider"></div>

    <div className="project-pill">
      <Icon name="book" size={13} />

    <div className="topbar-actions">

      </button>
      <button className="btn" onClick={onSave} disabled={!hasObjects} title="保存画面 (JSON)">
        <Icon name="save" size={13} /> 保存
      </button>
      <button className="btn primary" onClick={onExport} disabled={!hasObjects}>

      <div className="avatars">

/* ============================================================
   GENERATION BAR
   ============================================================ */
const GenerateBar = ({ hasObjects, genState, onPreview, onGenerate }) => {

  return (

          </span>

          <Icon name="zap" size={14} /> {genState.running ? '生成中…' : '生成有声绘本'}
        </button>
      )}

/* ============================================================

   ============================================================ */
const StageTop = ({ onAIHint, aiThinking, bgTemplate, onBgChange }) => (
  <div className="stage-top">
    <button className="ai-prompt-btn" onClick={onAIHint} disabled={aiThinking}>
      <span className={`sparkle-bubble ${aiThinking ? 'thinking' : ''}`}>
        <Icon name="sparkles" size={14} />

          title={b.name}
        ></div>
      ))}

  </div>

/* ============================================================
   PLAYER MODAL
   ============================================================ */
const PlayerModal = ({ story, totalLen, onClose }) => {
  const [t, setT] = useS(0);
  const [playing, setPlaying] = useS(true);
  useE(() => {
    if (!playing) return;
    const start = performance.now() - t * 1000;
    let raf;
    const tick = (now) => {
      const elapsed = (now - start) / 1000;
      if (elapsed >= totalLen) {
        setT(totalLen);
        setPlaying(false);
        return;
      }
      setT(elapsed);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [playing]);

  // play voice + occasional icon sound
  useE(() => {
    if (!playing) return;
    const cancel = playVoiceLine(Math.min(3, totalLen - t), () => {});
    return cancel;
  }, [playing]);

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const pct = (t / totalLen) * 100;

  return (
    <div className="player-modal" onClick={onClose}>
      <div className="player-box" onClick={(e) => e.stopPropagation()}>
        <div className="player-cover" style={{ background: story.cover }}>
          <span>{story.glyph}</span>
        </div>
        <h3>{story.title}</h3>
        <div className="sub">你刚刚拼贴出来的有声绘本</div>
        <div className="player-progress">
          <div className="player-progress-fill" style={{ width: `${pct}%` }}></div>
        </div>
        <div className="player-time">
          <span>{fmt(t)}</span>
          <span>{fmt(totalLen)}</span>
        </div>
        <div className="player-controls" style={{ marginTop: 12 }}>
          <button className="pbtn" onClick={() => setT(0)} title="重头">
            <Icon name="replay" size={18} />
          </button>
          <button
            className="pbtn big"
            onClick={() => setPlaying(p => !p)}
            title={playing ? '暂停' : '播放'}
          >
            <Icon name={playing ? 'pause' : 'play'} size={22} />
          </button>
          <button className="pbtn" onClick={onClose} title="关闭">
            <Icon name="x" size={18} />
          </button>
        </div>
      </div>
    </div>
  );
};

/* ============================================================
   APP ROOT
   ============================================================ */
const App = () => {
  const [storyId, setStoryId] = useS(window.DATA.STORIES[0].id);
  const [projectName, setProjectName] = useS(window.DATA.STORIES[0].title + ' · 我的版本');
  const [stepIndex, setStepIndex] = useS(0);
  const [voicePlaying, setVoicePlaying] = useS(false);
  const [showFullStory, setShowFullStory] = useS(true);
  const [bgTemplate, setBgTemplate] = useS(window.DATA.STORIES[0].bgTemplate);

  const [searchQuery, setSearchQuery] = useS('');
  const [activeCategory, setActiveCategory] = useS('all');

  // Canvas state — managed with simple history
  const [history, setHistory] = useS([{ objects: [], selectedId: null }]);
  const [historyIdx, setHistoryIdx] = useS(0);
  const current = history[historyIdx];
  const objects = current.objects;
  const selectedId = current.selectedId;

  const [aiHint, setAiHint] = useS(null);          // bubble on canvas
  const [aiRecommend, setAiRecommend] = useS(null); // panel on right
  const [aiThinking, setAiThinking] = useS(false);

  const [genState, setGenState] = useS({ running: false, stage: null, done: false });
  const [playerOpen, setPlayerOpen] = useS(false);
  const [toast, setToast] = useS(null);

  const story = window.DATA.STORIES.find(s => s.id === storyId);

  // History helpers
  const pushHistory = useC((mut) => {
    const next = mut(current);
    const truncated = history.slice(0, historyIdx + 1);
    truncated.push(next);
    setHistory(truncated.slice(-50));
    setHistoryIdx(Math.min(truncated.length - 1, 49));
  }, [history, historyIdx, current]);

  const replaceCurrent = useC((mut) => {
    const next = mut(current);
    const copy = history.slice();
    copy[historyIdx] = next;
    setHistory(copy);
  }, [history, historyIdx, current]);

  // Switch story → reset canvas, step, bg
  const switchStory = (id) => {
    if (id === storyId) return;
    const s = window.DATA.STORIES.find(x => x.id === id);
    setStoryId(id);
    setStepIndex(0);
    setBgTemplate(s.bgTemplate);
    setHistory([{ objects: [], selectedId: null }]);
    setHistoryIdx(0);
    setAiHint(null);
    setAiRecommend(null);
    setGenState({ running: false, stage: null, done: false });
    setProjectName(s.title + ' · 我的版本');
    setVoicePlaying(false);
  };

  // Voice controls — fakes TTS by playing a tone sequence for step.voiceLen
  const voiceTimerRef = useR(null);
  const voiceCleanupRef = useR(null);
  const stopVoice = () => {
    setVoicePlaying(false);
    if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
    if (voiceCleanupRef.current) { voiceCleanupRef.current(); voiceCleanupRef.current = null; }
  };
  useE(() => { return () => stopVoice(); }, []);

  const playVoice = () => {
    const step = story.steps[stepIndex];
    setVoicePlaying(true);
    voiceCleanupRef.current = playVoiceLine(step.voiceLen, () => {
      setVoicePlaying(false);
      voiceCleanupRef.current = null;
    });
  };
  const replayVoice = () => { stopVoice(); setTimeout(playVoice, 50); };
  const nextStep = () => {
    if (stepIndex < story.steps.length - 1) {
      stopVoice();
      setStepIndex(stepIndex + 1);
    }
  };
  const selectStep = (i) => { stopVoice(); setStepIndex(i); };

  // AI hint
  const triggerAIHint = () => {
    const step = story.steps[stepIndex];
    setAiThinking(true);
    setAiHint(null);
    setAiRecommend(null);
    setTimeout(() => {
      setAiHint({
        kind: step.hint.kind,
        text: step.hint.text,
      });
      setAiRecommend({
        ids: step.hint.recommend,
        reason: `来自这一句：「${step.text}」`,
      });
      setAiThinking(false);
      // briefly play a soft chime
      playTone(880, 0.15, 'triangle', 0.1);
      setTimeout(() => playTone(1320, 0.18, 'triangle', 0.1), 90);
    }, 700);
  };

  // Canvas object ops
  const addIcon = (iconId, x, y) => {
    const id = newObjectId();
    pushHistory((c) => ({
      objects: [...c.objects, {
        id, iconId,
        x: x ?? 50, y: y ?? 50,
        scale: 1, rotation: 0,
        z: (c.objects.length || 0) + 1,
      }],
      selectedId: id,
    }));
    // chime
    playTone(659, 0.12, 'sine', 0.1);
    setTimeout(() => playIconSound(findIcon(iconId)), 100);
  };
  const selectObj = (id) => replaceCurrent((c) => ({ ...c, selectedId: id }));
  const updateObj = (id, patch) => {
    replaceCurrent((c) => ({
      ...c,
      objects: c.objects.map(o => o.id === id ? { ...o, ...patch } : o),
    }));
  };
  // When user finishes dragging — commit to history
  const commitObj = () => {
    pushHistory((c) => c);
  };
  const deleteObj = (id) => {
    pushHistory((c) => ({
      objects: c.objects.filter(o => o.id !== id),
      selectedId: c.selectedId === id ? null : c.selectedId,
    }));
  };
  const copyObj = (id) => {
    const src = current.objects.find(o => o.id === id);
    if (!src) return;
    const nid = newObjectId();
    pushHistory((c) => ({
      objects: [...c.objects, { ...src, id: nid, x: Math.min(95, src.x + 6), y: Math.min(95, src.y + 6), z: c.objects.length + 1 }],
      selectedId: nid,
    }));
  };
  const clearCanvas = () => {
    if (!objects.length) return;
    if (!confirm('确定清空画布吗？')) return;
    pushHistory(() => ({ objects: [], selectedId: null }));
  };
  const undo = () => historyIdx > 0 && setHistoryIdx(historyIdx - 1);
  const redo = () => historyIdx < history.length - 1 && setHistoryIdx(historyIdx + 1);

  // Save / export
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  };
  const saveCanvas = () => {
    const payload = {
      story_id: storyId,
      current_step: stepIndex,
      story_text: story.fullText,
      voice_prompt_id: `prompt_${storyId}_${stepIndex + 1}`,
      bg_template: bgTemplate,
      canvas_objects: objects.map(o => {
        const icon = findIcon(o.iconId);
        return {
          instance_id: o.id,
          object_id: o.iconId,
          label: icon.name,
          x: Math.round(o.x * 9.2),
          y: Math.round(o.y * 5.4),
          scale: +o.scale.toFixed(2),
          rotation: o.rotation || 0,
          audio_id: `${o.iconId}_${icon.sound}.wav`,
          created_by: 'user',
          created_step: stepIndex + 1,
        };
      }),
    };
    try {
      localStorage.setItem('audiobook_save_' + storyId, JSON.stringify(payload));
    } catch {}
    console.log('[save]', payload);
    showToast('已保存当前画布 (JSON)');
  };

  const exportJSON = () => {
    const payload = {
      story_id: storyId,
      project_name: projectName,
      current_step: stepIndex,
      bg_template: bgTemplate,
      canvas_objects: objects,
      saved_at: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${projectName}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('作品已导出');
  };

  // Generate flow
  const startGenerate = () => {
    if (!objects.length) return;
    setGenState({ running: true, stage: 'analyze', done: false });
    const steps = ['analyze', 'arrange', 'voice', 'mix'];
    steps.forEach((s, i) => {
      setTimeout(() => {
        setGenState({ running: i < steps.length - 1, stage: s, done: false });
      }, i * 900);
    });
    setTimeout(() => {
      setGenState({ running: false, stage: null, done: true });
      playTone(523, 0.15, 'sine', 0.12);
      setTimeout(() => playTone(659, 0.15, 'sine', 0.12), 120);
      setTimeout(() => playTone(784, 0.25, 'sine', 0.14), 240);
    }, steps.length * 900);
  };

  const previewPlay = () => {
    setPlayerOpen(true);
    // also fire each icon's sound staggered
    objects.forEach((o, i) => {
      setTimeout(() => playIconSound(findIcon(o.iconId)), i * 250);
    });
  };

  // total length for player
  const totalLen = useM(() => {
    return Math.max(6, story.steps.reduce((a, s) => a + s.voiceLen, 0) + objects.length * 0.3);
  }, [story, objects]);

  return (
    <Frag>
      <div className="app">
        <TopBar
          projectName={projectName}
          onProjectName={setProjectName}
          onSave={saveCanvas}
          onExport={exportJSON}
          hasObjects={objects.length > 0}
        />
        <div className="main">
          <LeftSidebar
            shelf={{
              stories: window.DATA.STORIES,
              currentId: storyId,
              onSelect: switchStory,
            }}
            voice={{
              story,
              stepIndex,
              isPlaying: voicePlaying,
              onPlay: playVoice,
              onPause: stopVoice,
              onReplay: replayVoice,
              onNext: nextStep,
              onPrev: () => selectStep(Math.max(0, stepIndex - 1)),
              onStepSelect: selectStep,
            }}
            text={{
              story,
              stepIndex,
              recommendedIds: aiRecommend?.ids || [],
              showFull: showFullStory,
              onToggleFull: () => setShowFullStory(v => !v),
              onStepSelect: selectStep,
            }}
          />

          <div className="stage">
            <StageTop
              onAIHint={triggerAIHint}
              aiThinking={aiThinking}
              bgTemplate={bgTemplate}
              onBgChange={setBgTemplate}
            />
            <Canvas
              objects={objects}
              selectedId={selectedId}
              bgTemplate={bgTemplate}
              onSelect={selectObj}
              onUpdate={updateObj}
              onAdd={addIcon}
              onDelete={deleteObj}
              onCopy={copyObj}
              hint={aiHint}
              onHintClose={() => setAiHint(null)}
              onUndo={undo}
              onRedo={redo}
              canUndo={historyIdx > 0}
              canRedo={historyIdx < history.length - 1}
              onClear={clearCanvas}
            />
            <GenerateBar
              hasObjects={objects.length > 0}
              genState={genState}
              onPreview={previewPlay}
              onGenerate={startGenerate}
            />
          </div>

          <IconLibrary
            recommend={aiRecommend}
            onRecommendClose={() => setAiRecommend(null)}
            onPreviewSound={playIconSound}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            activeCategory={activeCategory}
            setActiveCategory={setActiveCategory}
          />
        </div>
      </div>

      {playerOpen && (
        <PlayerModal
          story={story}
          totalLen={totalLen}
          onClose={() => setPlayerOpen(false)}
        />
      )}

      {toast && (
        <div className="toast">
          <Icon name="check" size={13} />
          {toast}
        </div>
      )}
    </Frag>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

</body>
</html>
